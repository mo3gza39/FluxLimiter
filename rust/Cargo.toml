[package]
name = "fluxlimiter"
version = "0.1.0"
edition = "2021"
description = "FluxLimiter - a modern NetLimiter-like traffic monitor and limiter for Windows, written entirely in Rust"

[dependencies]
eframe = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
# Phase 2 (limiter engine): the WinDivert packet loop plugs into
# rate_limiter.rs; the crate is added when the engine is enabled so the
# monitoring build stays lean.

[profile.release]
opt-level = 3
lto = "thin"
strip = true
